# Master resume data — the factual source of truth for the auto-tailored
# resume feature (see api/generate.py). Bullets here are facts, not final
# copy: the generator may rephrase them per job posting but must not invent
# accomplishments, numbers, or responsibilities beyond what's written here
# and in resume_experience_bank.yaml.
#
# Reconciled from two parallel resume versions Caleb had been maintaining
# (one with the Association GM project + no Tech Business Fellows, one with
# Tech Business Fellows + no project, and two slightly different phrasings
# of the Revolution Learning title) — both are kept here, and the generator
# picks between the two optional blocks per posting. See optional_blocks
# below.

