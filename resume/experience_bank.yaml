# Extra accomplishments and experiences beyond master_resume.yaml, for the
# tailoring generator (api/generate.py) to draw on when they're relevant to
# a specific posting. The generator may rephrase wording per posting but
# must never invent facts beyond what's written here or in
# master_resume.yaml.
#
# Add entries by hand, or just tell Claude Code about something you did and
# have it add the entry for you. Keep each note factual and specific (what
# you did + the concrete outcome/scope), the same way the bullets in
# master_resume.yaml are written — that's what lets the generator rephrase
# it convincingly without stretching the truth.
#
# A leading [Role title] tells the generator which role a note belongs to
# when a company has more than one.
#
# The by_company bullets below were added on 2026-11-13 from the newer
# resume (resume/Caleb_Pratt_Resume.pdf, 2026-11 version), verbatim. They're
# true and current. They sit alongside master_resume.yaml's facts, which
# are the previous resume version's bullets.

